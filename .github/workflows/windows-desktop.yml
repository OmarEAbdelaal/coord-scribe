name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a pre-release (tag desktop-v<version>)'
        type: boolean
        default: false
  push:
    branches: ['main', 'codex/windows-desktop-phase-one', 'claude/dazzling-brahmagupta-nnbyqm']
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build and test desktop
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Smoke test frozen interface
        shell: pwsh
        run: |
          $env:COORDY_HOME = Join-Path $env:RUNNER_TEMP 'coord-smoke'
          $process = Start-Process dist/Coord/Coord.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Desktop smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
      - name: Upload installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: Coord-windows-x64
          path: |
            dist/installer/*.exe
            dist/Coord/
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "desktop-v$version"
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          Compress-Archive -Path dist/Coord -DestinationPath dist/Coord-portable-x64.zip
          gh release create $tag $installer.FullName dist/Coord-portable-x64.zip --target $env:GITHUB_SHA `
            --title "Coord $version" --prerelease `
            --notes "Test build. Unsigned installer: Windows SmartScreen will warn; choose More info, then Run anyway. Models download separately inside the app. See docs/desktop.md for setup and the acceptance checklist."
