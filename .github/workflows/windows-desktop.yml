name: Windows desktop installer
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/windows-desktop-phase-one']
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build and test desktop
        shell: pwsh
        run: ./scripts/build-desktop.ps1
      - name: Smoke test frozen interface
        shell: pwsh
        run: |
          $env:COORDY_HOME = Join-Path $env:RUNNER_TEMP 'coord-smoke'
          $process = Start-Process dist/Coord/Coord.exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Desktop smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Desktop smoke test failed' }
      - name: Upload installer and portable app
        uses: actions/upload-artifact@v4
        with:
          name: Coord-windows-x64
          path: |
            dist/installer/*.exe
            dist/Coord/
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem dist/installer/*.exe | Select-Object -First 1
          Compress-Archive -Path dist/Coord -DestinationPath dist/Coord-portable-x64.zip
          gh release create $env:GITHUB_REF_NAME $installer.FullName dist/Coord-portable-x64.zip `
            --title "Coord $($env:GITHUB_REF_NAME -replace '^desktop-v','')" --prerelease `
            --notes "Test build. Unsigned installer: Windows SmartScreen will warn; choose More info, then Run anyway. Models download separately inside the app. See docs/desktop.md for setup and the acceptance checklist."
